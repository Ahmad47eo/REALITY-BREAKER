name: Godot project check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit
      - name: Launch prototype headlessly
        run: godot --headless --path . --quit-after 10
